name: Build project (macOS)

on:
  push:

jobs:
  build-project-macos:
    runs-on: macos-15-intel

    env:
      CX_VERSION: "26.3.0"
      CX_SHA256: ac99c8ca4b3848f3e81784135f023df266b61c2345726ea55a50b3e030dd6872

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Cache CrossOver build result
        id: cache-crossover
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cx-sdk
          key: crossover-sdk-${{ env.CX_SHA256 }}

      - name: Install CrossOver dependencies
        run: |
          brew install bison flex mingw-w64 pkgconf
          # Brew doesn't link these by default.
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Download and verify CrossOver source
        if: steps.cache-crossover.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cx-source"

          curl --fail --location --retry 3 \
            "https://media.codeweavers.com/pub/crossover/source/crossover-sources-${CX_VERSION}.tar.gz" \
            -o "$RUNNER_TEMP/crossover.tar.gz"

          printf '%s  %s\n' \
            "$CX_SHA256" "$RUNNER_TEMP/crossover.tar.gz" |
            shasum -a 256 -c -

          tar -xzf "$RUNNER_TEMP/crossover.tar.gz" \
            -C "$RUNNER_TEMP/cx-source" sources/wine


      - name: Configure CrossOver Wine
        if: steps.cache-crossover.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          sdk="$GITHUB_WORKSPACE/.cx-sdk"
          build="$RUNNER_TEMP/cx-build"
          mkdir -p "$build"
          cd "$build"

          CC=clang CXX=clang++ \
          x86_64_CC=x86_64-w64-mingw32-gcc \
          "$RUNNER_TEMP/cx-source/sources/wine/configure" \
            --prefix="$sdk" \
            --enable-win64 \
            --enable-archs=x86_64 \
            --disable-tests \
            --without-x \
            --without-vulkan \
            --without-freetype \
            --without-gnutls \
            --without-gstreamer \
            --without-sdl

      - name: Add WINE SDK to PATH
        run: |
          sdk="$GITHUB_WORKSPACE/.cx-sdk"
          echo "WINE_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Build CrossOver Wine
        if: steps.cache-crossover.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          make -C "$RUNNER_TEMP/cx-build" \
            -j"$(sysctl -n hw.ncpu)" install-dev

      - name: Build project
        run: |
          # CrossOver WINE is still just 11.0, so we can't build the new
          # unixlib version.
          make NATIVE_CC=clang WINE_DIR=$WINE_SDK BUILTIN=1 wine-osx native-osx

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wine-shmbridge
          path: |
            *.so
            *.dll
